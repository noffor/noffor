<!DOCTYPE html>
<html><head><title>Noffor Icons</title></head><body style="text-align:center;margin-top:50px;font-family:Arial">
<h2>Noffor Icon Generator</h2>
<p>Downloading icons...</p>
<canvas id="c192" width="192" height="192" hidden></canvas>
<canvas id="c512" width="512" height="512" hidden></canvas>
<script>
function draw(s,id){
  const c=document.getElementById(id),x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,s,s);g.addColorStop(0,'#f97316');g.addColorStop(1,'#ea580c');
  x.beginPath();x.roundRect(0,0,s,s,s*0.2);x.fillStyle=g;x.fill();
  x.fillStyle='white';x.font=`bold ${s*0.43}px Arial Black`;x.textAlign='center';x.textBaseline='middle';x.fillText('N',s/2,s*0.5);
  if(s===512){x.font=`bold ${s*0.09}px Arial`;x.fillText('Noffor',s/2,s*0.76);}
}
draw(192,'c192');draw(512,'c512');
setTimeout(()=>{
  document.getElementById('c192').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='icon-192.png';a.click()});
  setTimeout(()=>{document.getElementById('c512').toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='icon-512.png';a.click()});
  document.querySelector('p').textContent='✅ Done! Move files to public/ folder';
  },500)},500)
</script></body></html>
